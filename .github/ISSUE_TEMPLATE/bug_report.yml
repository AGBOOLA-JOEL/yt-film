name: Bug report
description: Something doesn't install, crashes, or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please don't paste API keys, your .env, or private images."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what happened, and what you expected.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS (Apple Silicon), macOS (Intel), Windows 10/11, Linux]
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: Memory (RAM)
      placeholder: e.g. 16 GB
  - type: textarea
    id: doctor
    attributes:
      label: Output of `python scripts/doctor.py`
      render: text
  - type: textarea
    id: log
    attributes:
      label: The command and the last ~30 lines of its output (or renders/bN.log)
      render: text
    validations:
      required: true
  - type: textarea
    id: stills
    attributes:
      label: Screenshots or a stills sheet (optional)
      description: "For visual problems: python tools/stills.py bN, then drag the image here."
